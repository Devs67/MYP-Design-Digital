<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1600" viewBox="0 0 1440 1600" preserveAspectRatio="xMidYMid slice" fill="none">
  <!-- Fluid background: white and blue colour fields (#FFFFFF, #DCEBFF, #A9D0FF), from Dev's colour table.
       Shapes from design/figma-export/background-desktop.svg. The 32px grid is drawn in CSS (glass.css) so it never scales. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1440" y2="1600" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".52" stop-color="#DCEBFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="orbA" cx="0" cy="0" r="1" gradientTransform="translate(300 470) rotate(45) scale(520 720)" gradientUnits="userSpaceOnUse"><stop stop-color="#A9D0FF" stop-opacity=".85"/><stop offset="1" stop-color="#A9D0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB" cx="0" cy="0" r="1" gradientTransform="translate(1160 970) rotate(125) scale(560 760)" gradientUnits="userSpaceOnUse"><stop stop-color="#A9D0FF" stop-opacity=".6"/><stop offset="1" stop-color="#DCEBFF" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="70"/></filter>
  </defs>
  <rect width="1440" height="1600" fill="url(#wash)"/>
  <ellipse cx="300" cy="470" rx="520" ry="720" fill="url(#orbA)" filter="url(#blur)"/>
  <ellipse cx="1160" cy="970" rx="560" ry="760" fill="url(#orbB)" filter="url(#blur)"/>
</svg>
