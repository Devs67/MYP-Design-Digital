<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1900" viewBox="0 0 390 1900" preserveAspectRatio="xMidYMin slice" fill="none">
  <!-- Dark version of backdrop-mobile-light.svg, built from the dark tokens. -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="390" y2="1900" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1220"/><stop offset=".55" stop-color="#122038"/><stop offset="1" stop-color="#0B1220"/></linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(110 540) rotate(48) scale(330 520)" gradientUnits="userSpaceOnUse"><stop stop-color="#5A95DD" stop-opacity=".32"/><stop offset="1" stop-color="#5A95DD" stop-opacity="0"/></radialGradient>
